name: Tailscale-Chrome-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install Chrome and Setup RDP
        run: |
          # Chrome install kar raha hai
          choco install googlechrome -y
          
          # RDP enable karna
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # User aur Password set karna
          net user runneradmin MySafePass123! /add
          net localgroup administrators runneradmin /add
          
          Write-Host "Setup Complete! Chrome installed."
          Write-Host "User: runneradmin"
          Write-Host "Pass: MySafePass123!"

      - name: Keep Alive (6 Hours)
        run: |
          $startTime = Get-Date
          while ((Get-Date) -lt $startTime.AddHours(5).AddMinutes(50)) {
            Write-Host "RDP Active... $((Get-Date))"
            Start-Sleep -Seconds 60
          }
