name: Direct-Tailscale-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install Tailscale
        shell: powershell
        run: |
          # Tailscale setup
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet", "/norestart" -Wait
          $env:Path += ";C:\Program Files\Tailscale"
          
          # Force Up with Reset (Bina kisi tag ke)
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TS_AUTH_KEY }} --hostname=GitHub-RDP --accept-routes --reset

      - name: Setup RDP & Get Login Info
        shell: powershell
        run: |
          # 1. Firewall Mukammal Band
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          
          # 2. RDP Enable
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # 3. User Setup (runneradmin)
          $Password = ConvertTo-SecureString "MySafePass123!" -AsPlainText -Force
          $User = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue
          if ($null -eq $User) {
              New-LocalUser -Name "runneradmin" -Password $Password -Description "RDP User"
              Add-LocalGroupMember -Group "Administrators" -Member "runneradmin"
          } else {
              $User | Set-LocalUser -Password $Password
          }

          # 4. GET IP ADDRESS
          $TS_IP = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4)

          # 5. PRINT ALL INFO IN GITHUB LOGS
          Write-Host "`n" + ("="*30)
          Write-Host "--- RDP LOGIN DETAILS ---"
          Write-Host "IP ADDRESS : $TS_IP"
          Write-Host "USERNAME   : runneradmin"
          Write-Host "PASSWORD   : MySafePass123!"
          Write-Host ("="*30) + "`n"

      - name: Keep Alive (6 Hours)
        shell: powershell
        run: |
          $startTime = Get-Date
          while ((Get-Date) -lt $startTime.AddHours(5).AddMinutes(50)) {
            $currentIP = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4)
            Write-Host "RDP Active on IP: $currentIP | Time: $((Get-Date))"
            Start-Sleep -Seconds 60
          }
